<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comercial Zaffari Portfolio</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; }

/* =========================
   PALETA — Comercial Zaffari
   (extraída da marca: navy + laranja)
   ========================= */

:root{
    --navy-950:#080B1C;
    --navy-900:#0D1330;
    --navy-800:#131B3D;
    --navy-700:#1A2450;
    --navy-600:#232E60;
    --navy-border:#2A3566;
    --navy-border-light:#3B4A85;

    --text:#EEF1F8;
    --muted:#8A93BA;

    --orange:#E48B00;
    --orange-dim:#B87000;
    --gold:#FDD998;

    --alerta:#C1443B;
}

body{
    background:radial-gradient(ellipse at top, var(--navy-800) 0%, var(--navy-950) 55%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:50px 25px;
}

.container{
    max-width:960px;
    margin:auto;
}

/* =========================
   CABEÇALHO / MARCA
   ========================= */

/* =========================
   HERO — cabeçalho unificado
   ========================= */

.hero{
    position:relative;
    background:linear-gradient(175deg, var(--navy-800) 0%, var(--navy-900) 100%);
    border:1px solid var(--navy-border);
    border-radius:18px;
    padding:38px 40px 26px;
    margin-bottom:36px;
    box-shadow:0 24px 55px rgba(3,5,16,.55);
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:3px;
    background:linear-gradient(90deg, transparent, var(--orange) 20%, var(--gold) 50%, var(--orange) 80%, transparent);
}

.hero-topo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;
    flex-wrap:wrap;
    text-align:left;
    padding-bottom:26px;
    margin-bottom:20px;
    border-bottom:1px solid var(--navy-border);
}

.marca{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:linear-gradient(160deg,#FFFFFF, #F4EFE4);
    border-radius:14px;
    padding:14px 26px;
    box-shadow:
        0 0 0 1px rgba(228,139,0,.35),
        0 0 34px rgba(228,139,0,.16),
        0 14px 26px rgba(0,0,0,.4);
}

.marca img{
    height:46px;
    display:block;
}

.hero-texto h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:1.75rem;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--text);
}

.hero-texto p{
    margin-top:8px;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:.82rem;
}

.hero-texto p a{
    color:var(--orange);
    text-decoration:none;
}

.hero-texto p a:hover{ text-decoration:underline; }

/* =========================
   BARRA DE ATUALIZAÇÃO
   ========================= */

.status-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    color:var(--muted);
}

.status-bar .pulso{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--orange);
    display:inline-block;
    box-shadow:0 0 0 0 rgba(228,139,0,.6);
    animation:pulsar 2s infinite;
}

@keyframes pulsar{
    0%{ box-shadow:0 0 0 0 rgba(228,139,0,.55); }
    70%{ box-shadow:0 0 0 8px rgba(228,139,0,0); }
    100%{ box-shadow:0 0 0 0 rgba(228,139,0,0); }
}

.status-bar button{
    background:var(--navy-800);
    border:1px solid var(--navy-border-light);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:.75rem;
    font-weight:600;
    letter-spacing:.03em;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:.2s;
}

.status-bar button:hover{
    border-color:var(--orange);
    color:var(--orange);
}

.status-bar button:disabled{
    opacity:.5;
    cursor:default;
}

/* =========================
   SEÇÕES / CATEGORIAS
   ========================= */

.secao{
    margin-bottom:40px;
}

.secao-titulo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text);
}

.secao-titulo .icone{
    width:26px;
    height:26px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.9rem;
    flex-shrink:0;
}

.secao-titulo .contagem{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--muted);
    text-transform:none;
}

.secao--relatorios .secao-titulo .icone{
    background:rgba(253,217,152,.15);
    color:var(--gold);
    border:1px solid var(--gold);
}

.secao--operacao .secao-titulo .icone{
    background:rgba(228,139,0,.15);
    color:var(--orange);
    border:1px solid var(--orange);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
}

.card{
    background:var(--navy-800);
    border:1px solid var(--navy-border);
    border-left:4px solid var(--gold);
    border-radius:6px;
    padding:22px;
    text-decoration:none;
    color:var(--text);
    display:block;
    transition:.2s;
}

.secao--operacao .card{
    border-left-color:var(--orange);
}

.card:hover{
    transform:translateY(-3px);
    border-left-color:var(--orange);
    box-shadow:0 10px 24px rgba(0,0,0,.4);
}

.card h2{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:.02em;
    margin-bottom:8px;
    word-break:break-word;
}

.card p{
    font-size:.85rem;
    color:var(--muted);
    line-height:1.4;
    margin-bottom:16px;
    min-height:38px;
}

.meta{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:.72rem;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.04em;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    display:inline-block;
    margin-right:5px;
    background:var(--muted);
}

.dot.lang-javascript{ background:var(--gold); }
.dot.lang-html{ background:var(--alerta); }
.dot.lang-css{ background:var(--orange); }
.dot.lang-typescript{ background:var(--orange); }
.dot.lang-python{ background:var(--gold); }

.meta .atualizado.recente{
    color:var(--orange);
}

.meta .atualizado.aviso{
    color:var(--alerta);
}

.card.carregando p,
.card.carregando .meta{
    opacity:.45;
}

/* =========================
   ESTADO VAZIO
   ========================= */

.vazio{
    grid-column:1/-1;
    background:var(--navy-800);
    border:1px dashed var(--navy-border-light);
    border-radius:6px;
    padding:28px 22px;
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    line-height:1.5;
}

.vazio b{
    color:var(--text);
    display:block;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.03em;
    margin-bottom:6px;
    text-transform:uppercase;
    font-size:.85rem;
}

footer{
    text-align:center;
    margin-top:45px;
}

footer a{
    display:inline-block;
    padding:12px 24px;
    border:1px solid var(--orange);
    color:var(--orange);
    border-radius:6px;
    text-decoration:none;
    font-weight:700;
    font-size:.82rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    transition:.2s;
}

footer a:hover{
    background:var(--orange);
    color:var(--navy-950);
}

@media(max-width:640px){
    body{ padding:30px 16px; }
    .hero{ padding:28px 22px 22px; }
    .hero-topo{ flex-direction:column; text-align:center; }
    .hero-texto p{ justify-content:center; }
    .status-bar{ flex-direction:column; gap:10px; }
    .marca{ padding:12px 22px; }
    .marca img{ height:38px; }
}

</style>
</head>
<body>

<div class="container">

    <div class="hero">

        <div class="hero-topo">
            <div class="marca">
                <img src="logo-zaffari.png" alt="Comercial Zaffari">
            </div>
            <div class="hero-texto">
                <h1>Comercial Zaffari Portfolio</h1>
                <p>github.com/<a href="https://github.com/ComercialZaffariCD107" target="_blank">ComercialZaffariCD107</a></p>
            </div>
        </div>

        <div class="status-bar">
            <span><span class="pulso"></span> &nbsp;Sincronizado com o GitHub · <span id="horaAtualizacao">carregando…</span></span>
            <button id="btnAtualizar" onclick="carregarTudo(true)">🔄 Atualizar agora</button>
        </div>

    </div>

    <div class="secao secao--relatorios">
        <div class="secao-titulo">
            <span class="icone">📊</span>
            Relatórios
            <span class="contagem" id="contagemRelatorios"></span>
        </div>
        <div class="grid" id="gridRelatorios"></div>
    </div>

    <div class="secao secao--operacao">
        <div class="secao-titulo">
            <span class="icone">⚙️</span>
            Operação
            <span class="contagem" id="contagemOperacao"></span>
        </div>
        <div class="grid" id="gridOperacao"></div>
    </div>

    <footer>
        <a href="https://github.com/ComercialZaffariCD107?tab=repositories" target="_blank">Ver todos no GitHub →</a>
    </footer>

</div>

<script>

// =====================================================
// FERRAMENTAS
// Lista zerada — adicione um objeto por ferramenta aqui
// (categoria: "relatorios" ou "operacao"). O resto
// (linguagem, data de atualização) é resolvido
// automaticamente via API do GitHub.
// =====================================================

const FERRAMENTAS = [

    // ---------- RELATÓRIOS ----------

    { nome: "Análise de Pedidos Antigos", descricao: "Cruzamento de pedidos e status de etiquetas por carga, loja e produto.", url: "https://comercialzaffaricd107.github.io/An-lise-de-pedidos-antigos/", categoria: "relatorios" },
    { nome: "Comparativo de Estoque", descricao: "Divergências de estoque com impacto financeiro (ganho/perda) e exportação para WhatsApp.", url: "https://comercialzaffaricd107.github.io/Comparativo-de-estoque-/", categoria: "relatorios" },
    { nome: "Rejeito Geral", descricao: "Acompanhamento de rejeições com quebra por hora, motivos e exportação para WhatsApp.", url: "https://comercialzaffaricd107.github.io/Rejeito-Geral/", categoria: "relatorios" },

    // ---------- OPERAÇÃO ----------

    { nome: "Gerador de Abastecimento", descricao: "Gera sugestões de reabastecimento a partir de posições WMS e pedidos do Metabase.", url: "https://comercialzaffaricd107.github.io/Gerador-de-abastecimento-/", categoria: "operacao" },
    { nome: "Pendência PTL", descricao: "Controle de pendências PTL por pavilhão, com limite de pulmões e indicador de excedente.", url: "https://comercialzaffaricd107.github.io/Pend-ncia-PTL/", categoria: "operacao" },

];

const USUARIO_GITHUB = "ComercialZaffariCD107";

const INTERVALO_AUTO_ATUALIZACAO_MS = 5 * 60 * 1000; // 5 minutos

// extrai o nome do repositório a partir da URL do
// GitHub Pages (https://usuario.github.io/NOME-DO-REPO/)

function extrairNomeRepo(url){

    try{

        const partes =
        new URL(url).pathname.split("/").filter(Boolean);

        return partes[0] || null;

    }
    catch(erro){

        console.error("URL inválida:", url, erro);

        return null;

    }

}

// formata a diferença entre agora e a data informada
// em texto relativo ("agora", "há 5 min", "há 3 dias"...)

function formatarTempoRelativo(isoData){

    if(!isoData){
        return "sem dados";
    }

    const agora = new Date();

    const data = new Date(isoData);

    const diffMs = agora - data;

    const diffMin = Math.floor(diffMs / 60000);

    if(diffMin < 1){
        return "atualizado agora";
    }

    if(diffMin < 60){
        return `atualizado há ${diffMin} min`;
    }

    const diffHoras = Math.floor(diffMin / 60);

    if(diffHoras < 24){
        return `atualizado há ${diffHoras}h`;
    }

    const diffDias = Math.floor(diffHoras / 24);

    if(diffDias === 1){
        return "atualizado ontem";
    }

    if(diffDias < 7){
        return `atualizado há ${diffDias} dias`;
    }

    const diffSemanas = Math.floor(diffDias / 7);

    if(diffSemanas === 1){
        return "atualizado semana passada";
    }

    if(diffSemanas < 5){
        return `atualizado há ${diffSemanas} semanas`;
    }

    const diffMeses = Math.floor(diffDias / 30);

    return `atualizado há ${diffMeses} ${diffMeses === 1 ? "mês" : "meses"}`;

}

function ehRecente(isoData){

    if(!isoData){
        return false;
    }

    const diffHoras =
    (new Date() - new Date(isoData)) / 3600000;

    return diffHoras < 24;

}

// monta o HTML de um card (com ou sem dados carregados)
// dados === null      -> ainda carregando (esqueleto)
// dados === undefined -> repo não encontrado na resposta da API
// dados === "erro"    -> falha na API (rate limit / rede)
// dados === {...}     -> dados normais

function montarCardHtml(ferramenta, dados){

    const repo = extrairNomeRepo(ferramenta.url);

    const carregando = dados === null;

    const comErro = dados === "erro";

    const naoEncontrado = dados === undefined;

    const linguagem =
    (dados && typeof dados === "object" && dados.language)
    ? dados.language.toLowerCase()
    : "";

    let textoTempo = "sem dados";

    if(carregando){
        textoTempo = "carregando…";
    }
    else if(comErro){
        textoTempo = "limite da API atingido";
    }
    else if(naoEncontrado){
        textoTempo = "repositório não encontrado";
    }
    else{
        textoTempo = formatarTempoRelativo(dados?.pushed_at);
    }

    const classeRecente =
    !carregando && !comErro && !naoEncontrado && ehRecente(dados?.pushed_at)
    ? "recente"
    : (comErro || naoEncontrado ? "aviso" : "");

    const rotuloLinguagem =
    (dados && typeof dados === "object" && dados.language)
    ? dados.language
    : "—";

    return `
    <a class="card ${carregando ? "carregando" : ""}"
       href="${ferramenta.url}"
       target="_blank"
       data-repo="${repo || ""}">

        <h2>${ferramenta.nome}</h2>

        <p>${ferramenta.descricao}</p>

        <div class="meta">
            <span>
                <span class="dot ${linguagem ? "lang-" + linguagem : ""}"></span>${rotuloLinguagem}
            </span>
            <span class="atualizado ${classeRecente}">${textoTempo}</span>
        </div>

    </a>
    `;

}

function montarVazioHtml(){

    return `
    <div class="vazio">
        <b>Nenhuma ferramenta cadastrada ainda</b>
        Adicione um item na lista FERRAMENTAS do código-fonte desta página.
    </div>
    `;

}

function renderizarEsqueleto(){

    const relatorios =
    FERRAMENTAS.filter(f => f.categoria === "relatorios");

    const operacao =
    FERRAMENTAS.filter(f => f.categoria === "operacao");

    document.getElementById("gridRelatorios").innerHTML =
    relatorios.length
    ? relatorios.map(f => montarCardHtml(f, null)).join("")
    : montarVazioHtml();

    document.getElementById("gridOperacao").innerHTML =
    operacao.length
    ? operacao.map(f => montarCardHtml(f, null)).join("")
    : montarVazioHtml();

    document.getElementById("contagemRelatorios").innerText =
    `${relatorios.length} ferramenta${relatorios.length === 1 ? "" : "s"}`;

    document.getElementById("contagemOperacao").innerText =
    `${operacao.length} ferramenta${operacao.length === 1 ? "" : "s"}`;

}

// busca TODOS os repositórios do usuário numa única
// chamada à API (em vez de uma chamada por ferramenta),
// pra economizar o limite de requisições do GitHub
// (60/hora por IP sem login).

async function buscarTodosOsRepos(){

    try{

        const resposta = await fetch(
            `https://api.github.com/users/${USUARIO_GITHUB}/repos?per_page=100`
        );

        if(!resposta.ok){

            console.warn(
                `API do GitHub respondeu ${resposta.status} ao listar repositórios.`
            );

            return { erro: resposta.status };

        }

        const lista = await resposta.json();

        const mapaPorNome = {};

        lista.forEach(repo => {

            mapaPorNome[repo.name] = {
                pushed_at: repo.pushed_at,
                language: repo.language
            };

        });

        return { mapaPorNome };

    }
    catch(erro){

        console.error("Erro ao buscar repositórios:", erro);

        return { erro: "rede" };

    }

}

async function carregarTudo(forcadoPeloUsuario){

    const botao = document.getElementById("btnAtualizar");

    if(forcadoPeloUsuario && botao){

        botao.disabled = true;

        botao.innerText = "🔄 Atualizando…";

    }

    renderizarEsqueleto();

    if(!FERRAMENTAS.length){

        document.getElementById("horaAtualizacao").innerText =
        new Date().toLocaleTimeString("pt-BR");

        if(botao){

            setTimeout(() => {

                botao.disabled = false;

                botao.innerText = "🔄 Atualizar agora";

            }, 10000);

        }

        return;

    }

    const { mapaPorNome, erro } = await buscarTodosOsRepos();

    const resultados =
    FERRAMENTAS.map(ferramenta => {

        const repo = extrairNomeRepo(ferramenta.url);

        let dados;

        if(erro){

            dados = "erro";

        }
        else if(!repo || !mapaPorNome[repo]){

            dados = undefined;

        }
        else{

            dados = mapaPorNome[repo];

        }

        return { ferramenta, dados };

    });

    const relatorios =
    resultados.filter(r => r.ferramenta.categoria === "relatorios");

    const operacao =
    resultados.filter(r => r.ferramenta.categoria === "operacao");

    document.getElementById("gridRelatorios").innerHTML =
    relatorios.length
    ? relatorios.map(r => montarCardHtml(r.ferramenta, r.dados)).join("")
    : montarVazioHtml();

    document.getElementById("gridOperacao").innerHTML =
    operacao.length
    ? operacao.map(r => montarCardHtml(r.ferramenta, r.dados)).join("")
    : montarVazioHtml();

    document.getElementById("horaAtualizacao").innerText =
    erro
    ? `falha (${erro === "rede" ? "sem conexão" : "limite da API atingido"})`
    : new Date().toLocaleTimeString("pt-BR");

    if(botao){

        // cooldown de 10s pra evitar cliques repetidos
        // que estourem o limite de requisições

        setTimeout(() => {

            botao.disabled = false;

            botao.innerText = "🔄 Atualizar agora";

        }, 10000);

    }

}

window.addEventListener("load", () => {

    carregarTudo(false);

    setInterval(() => carregarTudo(false), INTERVALO_AUTO_ATUALIZACAO_MS);

});

</script>

</body>
</html>
